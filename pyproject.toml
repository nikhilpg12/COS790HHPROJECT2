[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-gp-hyperheuristic"
version = "0.1.0"
description = "LLM-assisted vanilla GP generation construction hyper-heuristic for educational timetabling"
requires-python = ">=3.11"
dependencies = [
  "ollama>=0.4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
